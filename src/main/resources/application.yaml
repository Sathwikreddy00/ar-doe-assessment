spring:
  application:
    name: assessment

  datasource:
    # Read from environment variable; fall back to local default if not set
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:9090}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.alpha.recon.doe: ${LOGGING_LEVEL_APP:DEBUG}
